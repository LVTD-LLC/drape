# Local Postgres for development and tests. Port 5433 so it does not
# collide with a Postgres you may already run on 5432.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: drape
      POSTGRES_DB: drape
    ports:
      - "127.0.0.1:55434:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
