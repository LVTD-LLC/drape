[package]
name = "core"
description = "Config, database, errors, telemetry and HTTP plumbing shared by every Drape crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
sqlx.workspace = true
# `fs` for the local upload directory (storage).
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

getrandom.workspace = true
# Already in the tree (API keys, webhooks); sign S3 requests without an SDK.
hmac = "0.13"
sha2.workspace = true
serde.workspace = true
serde_json = "1"
time.workspace = true
uuid.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
http-body-util.workspace = true
