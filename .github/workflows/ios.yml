name: iOS
on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "scripts/configure-development.py"
      - "scripts/test-live-gateway.py"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
      - "scripts/configure-development.py"
      - "scripts/test-live-gateway.py"
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select installed Xcode
        run: |
          xcodebuild -version
          xcrun simctl list devices available
      - name: Choose iPhone simulator
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          echo "DRAPE_SIMULATOR_ID=$SIMULATOR_ID" >> "$GITHUB_ENV"
      - name: Build and test
        run: |
          xcodebuild -project Drape.xcodeproj -scheme Drape \
            -destination "platform=iOS Simulator,id=$DRAPE_SIMULATOR_ID" \
            -derivedDataPath build -resultBundlePath build/TestResults.xcresult \
            test
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-test-results
          path: ios/build/TestResults.xcresult
